qlib_init:
  provider_uri: "~/.qlib/qlib_data/us_sp500_alpaca"
  region: us
  # MLflow 3.15+ disables its legacy filesystem tracking store by default.
  # An explicit SQL store also keeps qrun's experiment metadata local to this
  # project when the command is launched from the repository root.
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: sqlite:///mlflow.db
      default_exp_name: workflow

market: &market sp500
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
  # Alpaca IEX daily history returned by the 2020 backfill begins here.
  start_time: 2020-07-27
  end_time: 2026-08-24
  fit_start_time: 2020-07-27
  fit_end_time: 2022-12-30
  instruments: *market

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: 2025-01-02
    # Qlib needs the following trading session (2026-08-24) to execute the
    # final signal, so a backtest cannot end on the dataset's last session.
    end_time: 2026-08-21
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0005
      min_cost: 0

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.05
      subsample: 0.8789
      lambda_l1: 10
      lambda_l2: 20
      max_depth: 8
      num_leaves: 128
      num_threads: 8

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: [2020-07-27, 2022-12-30]
        valid: [2023-01-03, 2024-12-31]
        test: [2025-01-02, 2026-08-21]

  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
